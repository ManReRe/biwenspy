name: Update dashboard

# Manual trigger only, on purpose: the user wants to refresh the published
# dashboard whenever they choose (e.g. from the GitHub mobile app's Actions
# tab -> "Run workflow"), not on a fixed schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Only sync.py/dashboard.py's own deps -- playwright (capture_token.py's
        # manual-login helper) doesn't run here and isn't needed.
        run: pip install requests plotly tenacity

      - name: Write Biwenger session config
        env:
          BIWENGER_CONFIG: ${{ secrets.BIWENGER_CONFIG }}
        run: echo "$BIWENGER_CONFIG" > config.json

      - name: Sync league data
        run: python3 sync.py

      - name: Generate dashboard
        run: python3 dashboard.py

      - name: Commit and push if index.html changed
        # Transitional: still publishes to the old public GitHub Pages URL so
        # nothing breaks while the Cloudflare Pages + Access setup (private,
        # real login) is being verified. Remove this step once that's confirmed
        # working and the repo goes private -- see cloudflare-pages/README.md.
        run: |
          git config user.name "biwenspy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes." || git commit -m "Auto-update dashboard"
          git push

      - name: Deploy to Cloudflare Pages
        # Real access control lives here, not in the page itself: Cloudflare
        # Access sits in front of this deployment and blocks every request
        # until a one-time-PIN login succeeds. Requires CLOUDFLARE_API_TOKEN
        # and CLOUDFLARE_ACCOUNT_ID repo secrets -- see cloudflare-pages/README.md.
        # (No `if:` guard: the `secrets` context isn't allowed in a step's `if:`
        # expression -- GitHub rejects the whole workflow at dispatch time.)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          npx wrangler pages deploy dist --project-name=biwenspy --branch=master
